        }

            font-size: 16px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .result {
            border-bottom: 1px solid #eee;
            padding: 10px;
            margin-bottom: 5px;
            background-color: white;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .result:hover {

        }
        .codigo {

            margin-right: 10px;
            color: #3498db;
        }
        .count {
            margin-bottom: 15px;
            color: #7f8c8d;
        }
        .highlight {
            background-color: #ffeb3b;
            padding: 0 2px;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: 1px solid #ddd;
            border-bottom: none;
            background-color: #f1f1f1;
            border-radius: 4px 4px 0 0;
            margin-right: 5px;
        }
        .tab.active {
            background-color: white;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
        .copy-button {
            background-color: #e7e7e7;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
        .copy-button:hover {

        }
    </style>
</head>

        let searchMode = 'nome'; // 'nome' ou 'codigo'

        // Configurar abas de busca
        const tabNome = document.getElementById('tab-nome');
        const tabCodigo = document.getElementById('tab-codigo');
        
        tabNome.addEventListener('click', function() {
            searchMode = 'nome';
            tabNome.classList.add('active');
            tabCodigo.classList.remove('active');
            document.getElementById('search').placeholder = 'Digite para buscar por nome do procedimento (mínimo 3 caracteres)...';
            document.getElementById('search').value = '';
            document.getElementById('results').innerHTML = '';
            document.getElementById('count').innerHTML = '';
        });
        
        tabCodigo.addEventListener('click', function() {
            searchMode = 'codigo';
            tabCodigo.classList.add('active');
            tabNome.classList.remove('active');
            document.getElementById('search').placeholder = 'Digite para buscar por código do procedimento...';
            document.getElementById('search').value = '';
            document.getElementById('results').innerHTML = '';
            document.getElementById('count').innerHTML = '';
        });

        // Função para destacar o texto da busca nos resultados
        function highlightText(text, query) {
            if (!query) return text;
            
            const regex = new RegExp(query, 'gi');
            return text.replace(regex, match => `<span class="highlight">${match}</span>`);
        }
        
        // Função para copiar o código para a área de transferência
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert(`Código ${text} copiado para a área de transferência!`);
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
            });
        }

        // Configurar a busca
        const searchInput = document.getElementById('search');
        const resultsDiv = document.getElementById('results');
        const countDiv = document.getElementById('count');
        
        searchInput.addEventListener('input', function() {
            const query = this.value.toUpperCase();
            
            if ((searchMode === 'nome' && query.length < 3) || query.length === 0) {
                resultsDiv.innerHTML = '';
                countDiv.innerHTML = '';
                return;
            }
            
            // Buscar procedimentos
            let results = [];
            
            if (searchMode === 'nome') {
                results = procedimentos.filter(p => p.nome.toUpperCase().includes(query));
            } else {
                results = procedimentos.filter(p => p.codigo.includes(query));
            }
            
            // Mostrar contagem de resultados
            countDiv.innerHTML = `${results.length} procedimento(s) encontrado(s)`;
            
            // Mostrar resultados
            if (results.length > 0) {
                resultsDiv.innerHTML = results.map(p => {
                    const highlightedNome = highlightText(p.nome, query);
                    const highlightedCodigo = searchMode === 'codigo' ? highlightText(p.codigo, query) : p.codigo;
                    
                    return `
                        <div class="result">
                            <span class="codigo">${highlightedCodigo}</span>
                            <span class="nome">${highlightedNome}</span>
                            <button class="copy-button" onclick="copyToClipboard('${p.codigo}')">Copiar código</button>
                        </div>
                    `;
                }).join('');
            } else {
                resultsDiv.innerHTML = '<p>Nenhum procedimento encontrado</p>';
            }
        });
